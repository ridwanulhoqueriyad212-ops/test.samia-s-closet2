<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Samia's Closet - Admin
    </title>

    <link
        rel="stylesheet"
        href="./admin.css"
    >

</head>


<body>


<!-- ================= LOGIN ================= -->

<section
    id="loginScreen"
    class="login-screen"
>

    <div class="login-box">

        <h1>
            Samia's Closet
        </h1>

        <p>
            Admin Login
        </p>


        <form id="loginForm">

            <input
                type="email"
                id="loginEmail"
                placeholder="Admin Email"
                required
            >


            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                required
            >


            <button type="submit">
                Login
            </button>


            <p
                id="loginError"
                class="error"
            ></p>

        </form>

    </div>

</section>



<!-- ================= ADMIN ================= -->

<section
    id="adminApp"
    class="admin-app hidden"
>


    <!-- HEADER -->

    <header class="admin-header">

        <div>

            <h1>
                Samia's Closet
            </h1>

            <p>
                Admin Dashboard
            </p>

        </div>


        <button
            id="logoutBtn"
            class="logout-btn"
        >
            Logout
        </button>

    </header>



    <main class="dashboard">



        <!-- ================= ADD PRODUCT ================= -->

        <div class="dashboard-card">

            <h2>
                Add Product
            </h2>


            <form id="productForm">

                <input
                    type="text"
                    id="productName"
                    placeholder="Product Name"
                    required
                >


                <input
                    type="number"
                    id="productPrice"
                    placeholder="Price"
                    min="0"
                    required
                >


                <input
                    type="number"
                    id="productStock"
                    placeholder="Stock"
                    min="0"
                    required
                >


                <input
                    type="url"
                    id="productImage"
                    placeholder="Image URL"
                    required
                >


                <button type="submit">
                    Add Product
                </button>

            </form>


            <p id="productMessage"></p>

        </div>



        <!-- ================= PRODUCTS ================= -->

        <div class="dashboard-card">

            <div class="section-title">

                <h2>
                    Products
                </h2>

                <span id="productCount">
                    0 Products
                </span>

            </div>


            <div
                id="adminProducts"
                class="admin-products"
            >

                <p class="empty">
                    Loading products...
                </p>

            </div>

        </div>



        <!-- ================= ORDERS ================= -->

        <div class="dashboard-card">

            <div class="section-title">

                <h2>
                    Orders
                </h2>

                <span id="orderCount">
                    0 Orders
                </span>

            </div>


            <div
                id="adminOrders"
                class="admin-orders"
            >

                <p class="empty">
                    Loading orders...
                </p>

            </div>

        </div>


    </main>

</section>



<script
    type="module"
    src="./admin.js"
></script>


</body>
</html>
